[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhruvx"
version = "1.0.0"
description = "Cognitive Opportunistic LEO-Based Navigation & Timing System"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "DhruvX Team"}
]
keywords = ["pnt", "leo", "navigation", "gnss", "sdr", "iridium", "doppler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
    "sgp4>=2.20",
    "pyrtlsdr>=0.2.9",
    "flask>=2.0.0",
    "flask-socketio>=5.1.0",
    "pyserial>=3.5",
    "pyproj>=3.1.0",
    "pillow>=8.3.0",
    "psutil>=5.8.0",
    "pyqt5>=5.15.0",
    "pyqtgraph>=0.12.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
]
ml = [
    "torch>=1.9.0",
    "scikit-learn>=0.24.0",
]

[project.scripts]
dhruvx = "dhruvx.cli.main:main"
dhruvx-capture = "dhruvx.dsp.capture:main"
dhruvx-sdr-health = "dhruvx.sdr.health_monitor:main"
dhruvx-imu-server = "dhruvx.imu.dead_reckoning:main"

[project.urls]
Homepage = "https://github.com/dhruvx/dhruvx-pnt"
Repository = "https://github.com/dhruvx/dhruvx-pnt"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dhruvx = ["dashboard/templates/*.html", "config/*.yaml"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
